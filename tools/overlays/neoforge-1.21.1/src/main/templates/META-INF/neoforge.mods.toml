# Метаданные мода для NeoForge. Значения ${...} подставляются при сборке
# (Gradle — из gradle.properties, оффлайн-сборщик — оттуда же).

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Волшебная палочка в стиле Гарри Поттера: семь заклинаний на одном предмете.
Люмос и Нокс дают и убирают свет, Алохомора открывает двери и подаёт магический
сигнал редстоуна сквозь стены, Вингардиум Левиоса поднимает цель в воздух,
Акцио притягивает, Депульсо отталкивает, Инсендио поджигает.
ПКМ — применить, Shift + ПКМ — сменить заклинание.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
