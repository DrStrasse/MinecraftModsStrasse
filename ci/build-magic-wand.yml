name: Волшебная палочка — сборка jar

# Собирает мод «Волшебная палочка» для 1.21.1 под оба загрузчика и кладёт
# готовые jar-файлы в артефакты запуска. Запускается вручную и на push
# в ветки с изменениями шаблонов 1.21.1.
on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/fabric-1.21.1/**'
      - 'templates/neoforge-1.21.1/**'
      - '.github/workflows/build-magic-wand.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - fabric-1.21.1
          - neoforge-1.21.1
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        working-directory: templates/${{ matrix.template }}
        run: ./gradlew --no-daemon build

      - name: Список собранных jar
        working-directory: templates/${{ matrix.template }}
        run: ls -lh build/libs

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: magic-wand-${{ matrix.template }}
          path: |
            templates/${{ matrix.template }}/build/libs/*.jar
            !templates/${{ matrix.template }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
