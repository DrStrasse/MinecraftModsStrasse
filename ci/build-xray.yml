name: Strasse X-Ray — сборка jar

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/xray-fabric-1.21.1/**'
      - '.github/workflows/build-xray.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        working-directory: mods/xray-fabric-1.21.1
        run: ./gradlew --no-daemon build

      - name: Список собранных jar
        working-directory: mods/xray-fabric-1.21.1
        run: ls -lh build/libs

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: xray-strasse-fabric-1.21.1
          path: |
            mods/xray-fabric-1.21.1/build/libs/*.jar
            !mods/xray-fabric-1.21.1/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
