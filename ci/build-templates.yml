name: Build templates

on:
  push:
    branches: ["**"]
    paths:
      - "templates/**"
      - "tools/**"
      - ".github/workflows/build-templates.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Проверка JSON и скриптов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Валидация всех JSON
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "::error file=$f::невалидный JSON"; fail=1; }
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $fail
      - name: Проверка bash-скриптов
        run: bash -n tools/*.sh

  build:
    name: ${{ matrix.template }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { template: fabric-1.20.1,   java: 17 }
          - { template: fabric-1.21.1,   java: 21 }
          - { template: fabric-1.21.8,   java: 21 }
          - { template: fabric-1.21.11,  java: 21 }
          - { template: fabric-26.2,     java: 25 }
          - { template: forge-1.20.1,    java: 21 }
          - { template: neoforge-1.21.1, java: 21 }
          - { template: neoforge-1.21.8, java: 21 }
          - { template: neoforge-1.21.11, java: 21 }
          - { template: neoforge-26.2,   java: 25 }
    steps:
      - uses: actions/checkout@v4

      - name: Установка JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        working-directory: templates/${{ matrix.template }}
        run: ./gradlew build --stacktrace --no-daemon

      - name: Список артефактов
        working-directory: templates/${{ matrix.template }}
        run: ls -lh build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.template }}-jars
          path: templates/${{ matrix.template }}/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7
